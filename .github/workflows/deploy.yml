name: Construire et publier le site

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Rafraîchit les données du ministère le 1er de chaque mois à 4 h UTC
    - cron: "0 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : build_data.py date chaque contribution d'apres
          # le dernier commit qui a touche son fichier d'override. Avec le
          # checkout superficiel par defaut, git ne connait qu'un seul commit
          # et toutes les contributions paraissent dater du jour du deploiement.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valider les contributions
        run: python3 scripts/validate_overrides.py

      - name: Construire data/tracks.json depuis Data ES
        run: python3 scripts/build_data.py

      - name: Vérifier que le jeu de données est plausible
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data/tracks.json"))
          n = len(d["tracks"])
          print(f"{n} sites generes")
          if n < 5000:
              sys.exit(f"ERREUR : seulement {n} sites. Les exports sont verifies complets\n"
                       f"en amont (build_data.py, _export) : chercher plutot du cote de la\n"
                       f"jointure equipements/installations ou des contributions.")
          PY

      - name: Assembler le site (application FR/EN + pages statiques + API)
        # API_URL : URL du serveur de recherche (api/worker.js) s'il est deploye.
        # Sans elle, le site declare honnetement que seules les facettes statiques
        # sont disponibles — voir le document de capacites /api/tracks.json.
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          python3 scripts/build_site.py --out _site
          du -sh _site
          echo "$(find _site -name index.html | wc -l) pages HTML générées"
          echo "$(find _site/api -name '*.json' | wc -l) réponses JSON générées"

      - name: Vérifier que l'API est servable
        run: |
          python3 - <<'PY'
          import json, sys
          for f in ("_site/openapi.json", "_site/api/tracks.json", "_site/api/index.json"):
              d = json.load(open(f))
              print(f"{f} ok")
          o = json.load(open("_site/openapi.json"))
          if o.get("openapi") != "3.1.0" or not o.get("paths"):
              sys.exit("ERREUR : openapi.json incomplet")
          i = json.load(open("_site/api/index.json"))
          if len(i["tracks"]) < 5000:
              sys.exit(f"ERREUR : index a {len(i['tracks'])} entrees")
          # Un blanc n'est pas un non : acces_libre ne doit jamais valoir false.
          if any(t.get("al") not in (1, None) for t in i["tracks"]):
              sys.exit("ERREUR : acces_libre porte une valeur autre que 1 ou absent")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow est le pendant ouvert du bouton « Demander une indexation » :
  # Bing, Yandex, Seznam et Naver se partagent la notification. Google ne lit
  # pas ce protocole — c'est un signal de plus, pas un remplacant du plan de
  # site, et il vise surtout les agents qui s'appuient sur Bing.
  #
  # Apres le deploiement, jamais avant : le script lit les plans de site tels
  # qu'ils viennent d'etre publies et n'annonce que les URL datees du jour,
  # celles dont build_site.py a vu l'empreinte changer. Annoncer une page qui
  # n'est pas encore servie apprend au moteur que le signal ment.
  annoncer:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Annoncer les pages modifiées à IndexNow
        # Une annonce ratee ne doit pas peindre en rouge un deploiement reussi :
        # le site est en ligne, seul le faire-part s'est perdu. Le script rend
        # deja 0 sur toutes ses abstentions ; ceci couvre le reste.
        continue-on-error: true
        run: |
          python3 scripts/indexnow.py \
            --url "${{ vars.SITE_URL || 'https://pistes-athle.com' }}" --envoyer

  # Un echec ici ne casse rien en production — le site en ligne reste le
  # dernier build valide — et c'est precisement le probleme : rien ne le dit.
  # Le 26 aout 2026, un export tronque du portail a arrete la publication a
  # 22 h 13, et l'echec n'a ete vu que le lendemain matin. Le build mensuel du
  # 1er, personne ne le regarde passer : il lui faut une voix.
  alerte:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Signaler que la publication a echoue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENEMENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          gh label create publication-echouee --color B60205 \
            --description "Le site n'a pas pu etre republie" 2>/dev/null || true

          # Un seul billet ouvert a la fois : des echecs qui se suivent sont
          # presque toujours le meme, et trois billets identiques se lisent
          # moins bien qu'un seul qui s'allonge.
          ouvert=$(gh issue list --label publication-echouee --state open \
                     --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$ouvert" ]; then
            gh issue comment "$ouvert" \
              --body "Nouvel echec ($EVENEMENT, ${COMMIT:0:7}) : $RUN"
            exit 0
          fi

          printf '%s\n' \
            "Le workflow « Construire et publier le site » s'est arrete avant de deployer." \
            "" \
            "- Execution : $RUN" \
            "- Declencheur : \`$EVENEMENT\`" \
            "- Commit : \`$COMMIT\`" \
            "" \
            "**Le site en ligne n'a pas bouge** : il sert toujours le dernier build valide." \
            "Les echecs suivants viendront en commentaire ici, et ce billet se fermera" \
            "tout seul a la prochaine publication reussie." \
            "" \
            "La cause la plus frequente est un export partiel de Data ES. Le journal du" \
            "build nomme alors le nombre de lignes recues et le nombre annonce." \
            > corps.md

          gh issue create --label publication-echouee \
            --title "La publication du site a echoue" --body-file corps.md

  # Le pendant du billet ci-dessus : ce qui s'ouvre tout seul doit se refermer
  # tout seul, sinon il traine ouvert bien apres que la panne a cesse.
  clore:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Refermer un signalement laisse ouvert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label publication-echouee --state open \
                       --limit 20 --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Publication reussie : $RUN"
          done
